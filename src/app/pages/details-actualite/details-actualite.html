<div class="page-details-actualite">
    <app-nav-bar />
  
    <section class="section-content">
      <div class="container">
        
        <article class="actualite-detail">
          <div class="actualite-header">
            <span class="date">{{ actualite().date }}</span>
            <h1>{{ actualite().titre }}</h1>
            <p class="description">{{ actualite().description }}</p>
          </div>
  
          <div class="actualite-image">
            <img [src]="actualite().image" [alt]="actualite().titre" />
          </div>
  
          <div class="actualite-body">
            <p>{{ actualite().contenu }}</p>
          </div>
  
          <a routerLink="/actualites" class="btn-retour">
            <i class="bi bi-arrow-left"></i>
            Retour aux actualités
          </a>
        </article>
  
      </div>
    </section>
  </div>
