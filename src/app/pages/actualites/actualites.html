<div class="page-actualites">
    <app-nav-bar />
  
    <section class="section-header">
      <div class="container">
        <div class="titre-page">
          <h1>Actualités</h1>
        </div>
      </div>
    </section>
  
    <section class="section-liste">
      <div class="container">
        <div class="liste-actualites">
          @for (actu of listeActualites; track actu.id) {
            <app-map-actualite 
              [titre]="actu.titre"
              [date]="actu.date"
              [image]="actu.image"
              [lien]="'/actualites/' + actu.id"
            />
          }
        </div>
      </div>
    </section>
  </div>
