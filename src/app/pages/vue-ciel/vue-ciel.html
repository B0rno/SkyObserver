<div class="page-vue-ciel">
    <app-nav-bar />

    <div class="content">
      <div class="container">
        <div class="row g-4">

          <!-- Grille des astres -->
          <div class="col-lg-8">
            <div class="bloc-astres">
              <h1>À {{ ville() }} vous pouvez observer :</h1>
              <div class="grille-astres">
                @for (astre of astresVisibles; track astre.id) {
                  <app-map-astre
                    [id]="astre.id"
                    [nom]="astre.nom"
                    [description]="astre.description"
                    [image]="astre.image"
                  />
                }
              </div>
            </div>
          </div>

          <!-- Sidebar -->
          <div class="col-lg-4">
            <div class="sidebar">
              <app-widget-meteo
              [lat]="lat"
              [lon]="lon"
              [ville]="ville()">
             </app-widget-meteo>

              <button class="btn-sauvegarder" (click)="sauvegarder()">
                <i class="bi bi-bookmark"></i>
                Sauvegarder
              </button>
            </div>
          </div>

        </div>
      </div>
    </div>
  </div>
